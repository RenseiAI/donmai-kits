name: sign

# Main-only keyless signing for both compatibility manifests and complete kit
# package descriptors. Package ordering is load-bearing:
#
#   1. preserve + verify an unchanged kit.toml.sigstore bundle;
#   2. re-sign it only when kit.toml changed (which CI requires to accompany a
#      kit.version bump for any payload change);
#   3. generate canonical kit.package.json after the legacy bundle is stable;
#   4. sign + verify kit.package.json; and
#   5. stage every descriptor/bundle plus the activation marker;
#   6. verify an immutable archive of that exact Git tree; and
#   7. commit only when the resulting commit has that verified tree.
#
# The descriptor inventories kit.toml.sigstore, so refreshing an unchanged
# legacy bundle would change package identity at the same kit id/version. The
# workflow therefore never performs nondeterministic signature refreshes.
# kit.package.json.sigstore is detached package metadata and is not inventoried,
# avoiding a signature self-reference. The accepted package contract is
# donmai-architecture/ADR-2026-07-10-deterministic-kit-packages-and-command-composition.md.

on:
  push:
    branches: [main]
    paths:
      - "kits/**"
      - "scripts/package_kits.py"
      - "tests/test_package_integrity.py"
      - ".github/workflows/sign.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: sign-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_SAN: "https://github.com/RenseiAI/donmai-kits/.github/workflows/sign.yml@refs/heads/main"
  EXPECTED_ISSUER: "https://token.actions.githubusercontent.com"

jobs:
  validate:
    name: validate before signing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifests, skills, and package candidate state
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/validate_kits.py
          python3 -m unittest discover -s tests -v
          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${BEFORE_SHA:-}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            python3 scripts/package_kits.py ci-check --base-ref "${BEFORE_SHA}"
          elif [[ -f .kit-package-v1-active ]]; then
            python3 scripts/package_kits.py check
          else
            python3 scripts/package_kits.py check --allow-legacy-only
          fi

  sign:
    name: keyless-sign complete kit packages
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Require a publishable ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::manual package verification is restricted to refs/heads/main"
            exit 1
          fi

      - name: Preserve or sign legacy manifest compatibility bundles
        env:
          BEFORE_SHA: ${{ github.event.before }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(kits/*/kit.toml)
          expected_manifests=(
            kits/go/kit.toml
            kits/java/kit.toml
            kits/python/kit.toml
            kits/ruby/kit.toml
            kits/rust/kit.toml
            kits/ts-nextjs/kit.toml
            kits/typescript/kit.toml
          )
          if [[ "${manifests[*]}" != "${expected_manifests[*]}" ]]; then
            echo "::error::official publication is frozen to the exact authorized seven manifests"
            exit 1
          fi

          for manifest in "${manifests[@]}"; do
            bundle="${manifest}.sigstore"
            changed=false
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" && -n "${BEFORE_SHA:-}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
              if ! git diff --quiet "${BEFORE_SHA}" HEAD -- "${manifest}"; then
                changed=true
              fi
            fi

            echo "::group::legacy ${manifest}"
            if [[ "${changed}" == "true" || ! -f "${bundle}" ]]; then
              if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
                echo "::error::${manifest} needs a new legacy signature, but only a main push may issue the allowlisted identity"
                exit 1
              fi
              cosign sign-blob \
                --yes \
                --new-bundle-format=true \
                --bundle "${bundle}" \
                "${manifest}"
            fi
            cosign verify-blob \
              --new-bundle-format=true \
              --bundle "${bundle}" \
              --certificate-identity "${EXPECTED_SAN}" \
              --certificate-oidc-issuer "${EXPECTED_ISSUER}" \
              "${manifest}"
            echo "::endgroup::"
          done

      - name: Generate deterministic package descriptors
        run: python3 scripts/package_kits.py generate

      - name: Sign or preserve package descriptor bundles
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          shopt -s nullglob
          descriptors=(kits/*/kit.package.json)
          expected_descriptors=(
            kits/go/kit.package.json
            kits/java/kit.package.json
            kits/python/kit.package.json
            kits/ruby/kit.package.json
            kits/rust/kit.package.json
            kits/ts-nextjs/kit.package.json
            kits/typescript/kit.package.json
          )
          if [[ "${descriptors[*]}" != "${expected_descriptors[*]}" ]]; then
            echo "::error::generator did not emit the exact authorized seven descriptors"
            exit 1
          fi

          for descriptor in "${descriptors[@]}"; do
            bundle="${descriptor}.sigstore"
            needs_signature=false
            if ! git cat-file -e "HEAD:${descriptor}" 2>/dev/null; then
              needs_signature=true
            elif ! git diff --quiet HEAD -- "${descriptor}"; then
              needs_signature=true
            elif [[ ! -f "${bundle}" ]]; then
              needs_signature=true
            fi

            echo "::group::package ${descriptor}"
            if [[ "${needs_signature}" == "true" ]]; then
              if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
                echo "::error::${descriptor} needs a trusted package signature, but this event is verify-only"
                exit 1
              fi
              cosign sign-blob \
                --yes \
                --new-bundle-format=true \
                --bundle "${bundle}" \
                "${descriptor}"
            fi
            cosign verify-blob \
              --new-bundle-format=true \
              --bundle "${bundle}" \
              --certificate-identity "${EXPECTED_SAN}" \
              --certificate-oidc-issuer "${EXPECTED_ISSUER}" \
              "${descriptor}"
            echo "::endgroup::"
          done

      - name: Activate and fail-closed validate the published package set
        run: |
          set -euo pipefail
          printf '%s' '{"schema":"donmai.dev/kit-package/v1","state":"active"}' > .kit-package-v1-active
          python3 scripts/validate_kits.py
          python3 scripts/package_kits.py check

      - name: Verify immutable package tree and commit it back to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::package publication commits are restricted to a main push"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .kit-package-v1-active \
            kits/*/kit.toml.sigstore \
            kits/*/kit.package.json \
            kits/*/kit.package.json.sigstore

          # Bind the signer output to the only allowed dirty shape before
          # deriving the candidate Git tree. Authored payload remains the
          # already-reviewed HEAD tree; only generated publication files are
          # staged here.
          python3 scripts/package_kits.py publication-check
          if git diff --cached --quiet; then
            echo "no package publication changes to commit"
            exit 0
          fi

          candidate_tree="$(git write-tree)"
          snapshot="$(mktemp -d)"
          trap 'rm -rf "${snapshot}"' EXIT
          git archive --format=tar "${candidate_tree}" | tar -xf - -C "${snapshot}"

          # This archive, not the mutable Actions worktree, is the publication
          # authority. Recompute every inventory and re-verify both signature
          # classes against the exact bytes and modes in the candidate tree.
          python3 "${snapshot}/scripts/validate_kits.py"
          python3 "${snapshot}/scripts/package_kits.py" check

          kits=(go java python ruby rust ts-nextjs typescript)
          for kit in "${kits[@]}"; do
            manifest="${snapshot}/kits/${kit}/kit.toml"
            cosign verify-blob \
              --new-bundle-format=true \
              --bundle "${manifest}.sigstore" \
              --certificate-identity "${EXPECTED_SAN}" \
              --certificate-oidc-issuer "${EXPECTED_ISSUER}" \
              "${manifest}"

            descriptor="${snapshot}/kits/${kit}/kit.package.json"
            cosign verify-blob \
              --new-bundle-format=true \
              --bundle "${descriptor}.sigstore" \
              --certificate-identity "${EXPECTED_SAN}" \
              --certificate-oidc-issuer "${EXPECTED_ISSUER}" \
              "${descriptor}"
          done

          if [[ "$(git write-tree)" != "${candidate_tree}" ]]; then
            echo "::error::staged publication changed during immutable-tree verification"
            exit 1
          fi
          git commit -m "chore(sign): publish signed kit packages [skip ci]"
          if [[ "$(git rev-parse 'HEAD^{tree}')" != "${candidate_tree}" ]]; then
            echo "::error::publication commit does not contain the verified candidate tree"
            exit 1
          fi
          git push

      - name: Upload signed packages as a build artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: signed-kit-packages
          path: |
            .kit-package-v1-active
            kits/*/**
          if-no-files-found: error
