name: validate

# Validates every kit manifest and deterministic package descriptor on every
# push and pull request. Pure-stdlib Python validators keep the gate hermetic.
#
# Keyless Sigstore signing lives in `sign.yml`. Human PRs never edit generated
# descriptors or detached bundles: this workflow validates the payload and
# version-bump candidate, while the main-only signer publishes the exact
# descriptor/bundle set and activation marker atomically.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-schema:
    name: validate kit manifests and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate every kit.toml against the schema
        run: python3 scripts/validate_kits.py

      - name: Test catalog and Agent Skills conformance
        run: python3 -m unittest discover -s tests -v

      - name: Validate deterministic package inventory and publication state
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_ref=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${PR_BASE_SHA}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${PUSH_BEFORE_SHA:-}" && ! "${PUSH_BEFORE_SHA}" =~ ^0+$ ]]; then
            base_ref="${PUSH_BEFORE_SHA}"
          fi

          if [[ -n "${base_ref}" ]]; then
            args=(ci-check --base-ref "${base_ref}")
            if [[ "${GITHUB_ACTOR}" == "github-actions[bot]" ]]; then
              args+=(--allow-generated-signatures)
            fi
            python3 scripts/package_kits.py "${args[@]}"
          elif [[ -f .kit-package-v1-active ]]; then
            python3 scripts/package_kits.py check
          else
            python3 scripts/package_kits.py check --allow-legacy-only
          fi

  oss-clean:
    name: OSS-clean (no private references)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo is OSS-public. Block private Linear IDs, the closed-source
      # architecture/platform repo names, and the product brand domain from
      # ever landing in a kit, doc, or workflow file. Mirrors the org-wide
      # publishing-hygiene grep.
      - name: Grep for private references
        run: |
          set -euo pipefail
          # The blocklist pattern itself lives in this workflow and in
          # CONTRIBUTING.md (which documents the grep), so exclude those two
          # self-referential files to avoid a guaranteed false positive.
          PATTERN='REN-[0-9]|REN2-[0-9]|SUP-[0-9]|rensei-architecture|rensei-ops|RenseiAI/rensei|rensei-tui|rensei-platform|rensei\.ai'
          if grep -rnE "$PATTERN" \
              --include='*.toml' \
              --include='*.md' \
              --include='*.yaml' \
              --include='*.yml' \
              --include='*.sh' \
              --include='*.cmd' \
              --include='*.json' \
              --include='*.py' \
              --exclude-dir='.git' \
              --exclude='validate.yml' \
              --exclude='CONTRIBUTING.md' \
              .; then
            echo "::error::Private references found — strip them before merging (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "OSS-clean: no private references found."
